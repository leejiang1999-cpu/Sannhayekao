<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#05010a;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;user-select:none}

function showBar(){document.getElementById("author").innerText="👑 NIÊ NGỌC HIẾU • "+netSt+" ONLINE: "+cnt+" NGƯỜI";}
function randThinh(){let a=thinh30.split("|");curThinh=a.at(Math.floor(Math.random()*a.length));document.getElementById("fpreview").innerText="💬 "+curThinh;}
function upName(){let v=document.getElementById("nm").value.trim();if(v)me=v;}
function sync(){
  upName();showBar();
  let d={id:UID,n:me,x:Math.round(mx),y:Math.round(my),d:dance,g:gen,c:myCl,s:stT>0?say:"",t:Date.now()};
  fetch(DB+"/"+UID+".json",{method:"PUT",body:JSON.stringify(d)}).then(r=>{netSt=r.ok?"✅":"❌"+r.status;showBar();}).catch(()=>{netSt="❌Mạng";showBar();});
  fetch(DB+".json?t="+Date.now()).then(r=>r.json()).then(data=>{
    if(!data)return;let now=Date.now(),nw="",c=0,vals=Object.values(data);
    for(let i=0;i<vals.length;i++){let u=vals.at(i);if(!u||!u.id||now-u.t>90000)continue;c++;if(u.id===UID)continue;let cs=(u.s||"").split("|").join(" ").split(",").join(" ");nw+=(nw?"|":"")+u.n+","+u.x+","+u.y+","+u.c+","+u.d+","+u.g+","+cs;}
    online=nw;cnt=Math.max(1,c);showBar();
  }).catch(()=>{});
}
sync();setInterval(sync,1500);
function tone(tp,f1,f2,vol,dur){let t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=tp;o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.005,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur);}
function playStep(){if(!ac)return;let s=step%16,mel=beats.split("|").at(trk).split(",");if(s%4===0)tone("sine",150,35,0.65,0.16);if(s%4===2)tone("sawtooth",65,110,0.28,0.14);if(s%2===1)tone("square",3200,1200,0.05,0.04);let nf=Number(mel.at(s));if(nf>0)tone("sawtooth",nf,nf*1.01,0.14,0.13);step++;}
function startMusic(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();if(!iv)iv=setInterval(playStep,135);}
function togGen(){gen=gen===0?1:0;document.getElementById("gbtn").innerText=gen===0?"🧑 NAM":"👩 NỮ";sync();}
function nextBeat(){startMusic();trk=(trk+1)%3;say="🎧 BEAT "+(trk+1);stT=70;sync();}
function join(){upName();startMusic();setDance(dance,"LÊN SÀN ONLINE!");}
function setDance(d,txt){upName();startMusic();dance=d;say=txt;stT=90;sync();}
function sendFlirt(){document.getElementById("flirt").style.display="none";say="💘 "+curThinh;stT=260;dance=6;if(tgt==="Bé Mơ"){rep="Ko nhaz! 🙅‍♀️";repT=260;}else if(tgt==="Tèo Cà"||tgt==="Út Lan"){rep="Okela chốt đơn kem tươi luôn! 😍";repT=260;}sync();}
function sendChat(){let el=document.getElementById("msg"),v=el.value.trim();if(!v)return;upName();startMusic();say="💬 "+v;stT=320;el.value="";sync();}
  cv.addEventListener("pointerdown",e=>{
  startMusic();let r=cv.getBoundingClientRect();
  let tx=(e.clientX-r.left)*(420/r.width),ty=Math.max(185,Math.min(325,(e.clientY-r.top)*(350/r.height)));
  let hit="",all=bots+(online?"|"+online:"");
  all.split("|").forEach(s=>{if(!s)return;let p=s.split(","),px=Number(p.at(1)),py=Number(p.at(2));if(Math.hypot(tx-px,ty-py)<26)hit=p.at(0)+","+px+","+py;});
  if(hit){let h=hit.split(",");tgt=h.at(0);mx=Number(h.at(1))-24;my=Number(h.at(2))+2;randThinh();document.getElementById("ftitle").innerText="💌 Thả thính "+tgt+":";document.getElementById("flirt").style.display="block";}
  else{document.getElementById("flirt").style.display="none";mx=tx;my=ty;tgt="";}
  sync();
});
function loop(){
  ctx.clearRect(0,0,420,350);if(stT>0)stT--;if(repT>0)repT--;
  let c1=cls.split("|").at(step%8),c2=cls.split("|").at((step+3)%8),pulse=(step%4===0)?4:0;
  let bg=ctx.createRadialGradient(210,120,20,210,180,260);bg.addColorStop(0,c1+"44");bg.addColorStop(0.6,"#16042b");bg.addColorStop(1,"#05010a");
  ctx.fillStyle=bg;ctx.fillRect(0,0,420,350);
  ctx.fillStyle="#18062c";ctx.beginPath();ctx.moveTo(30,155);ctx.lineTo(390,155);ctx.lineTo(420,335);ctx.lineTo(0,335);ctx.closePath();ctx.fill();
  for(let r=0;r<4;r++){for(let c=0;c<6;c++){ctx.fillStyle=cls.split("|").at((r+c+Math.floor(step/2))%8)+"38";let y1=160+r*42,w1=60+r*4,x1=35+c*w1-r*10;ctx.fillRect(x1,y1,w1-4,38);}}
  ctx.save();ctx.globalCompositeOperation="lighter";
  for(let i=0;i<5;i++){let lx=210+Math.sin(Math.sin(step*0.18+i)*1.1+i)*220;ctx.strokeStyle=cls.split("|").at((i+step)%8);ctx.lineWidth=16;ctx.globalAlpha=0.22;ctx.beginPath();ctx.moveTo(20+i*95,0);ctx.lineTo(lx,335);ctx.stroke();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.globalAlpha=0.65;ctx.beginPath();ctx.moveTo(20+i*95,0);ctx.lineTo(lx,335);ctx.stroke();}
  ctx.restore();ctx.fillStyle="#cfd8dc";ctx.beginPath();ctx.arc(210,56,12,0,Math.PI*2);ctx.fill();ctx.fillStyle=c2;ctx.beginPath();ctx.arc(207+Math.sin(step)*5,54,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#1a052e";ctx.fillRect(55,8,310,34);ctx.strokeStyle=c1;ctx.lineWidth=3;ctx.strokeRect(55,8,310,34);
  ctx.fillStyle="#ffea00";ctx.font="bold 12px sans-serif";ctx.textAlign="center";ctx.fillText("🏪 TẠP HÓA & KEM TƯƠI EA KAO",210,23);
  ctx.fillStyle="#00e5ff";ctx.font="bold 10px sans-serif";ctx.fillText("🔥 ONLINE: "+cnt+" DÂN CHƠI • BEAT "+(trk+1),210,37);
  ctx.fillStyle="#12121c";ctx.fillRect(42-pulse/2,62-pulse/2,46+pulse,88+pulse);ctx.fillRect(332-pulse/2,62-pulse/2,46+pulse,88+pulse);
  ctx.strokeStyle=c1;ctx.lineWidth=2;ctx.strokeRect(42-pulse/2,62-pulse/2,46+pulse,88+pulse);ctx.strokeRect(332-pulse/2,62-pulse/2,46+pulse,88+pulse);
  ctx.fillStyle=c1;ctx.beginPath();ctx.arc(65,85,13+pulse,0,Math.PI*2);ctx.arc(65,125,15+pulse,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(355,85,13+pulse,0,Math.PI*2);ctx.arc(355,125,15+pulse,0,Math.PI*2);ctx.fill();
  let b1=Math.sin(step*0.9)*4,b2=Math.cos(step*0.9)*4;
  ctx.fillStyle="#ff9800";ctx.fillRect(162,92+b1,22,25);ctx.fillStyle="#ffcc80";ctx.beginPath();ctx.arc(173,82+b1,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#00e5ff";ctx.lineWidth=3;ctx.beginPath();ctx.arc(173,82+b1,10,Math.PI,0);ctx.stroke();ctx.fillStyle="#fff";ctx.font="bold 9px sans-serif";ctx.fillText("DJ Hiếu",173,67+b1);
  ctx.fillStyle="#e040fb";ctx.fillRect(236,92+b2,22,25);ctx.fillStyle="#ffcc80";ctx.beginPath();ctx.arc(247,82+b2,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#ffea00";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(257,96+b2);ctx.lineTo(266,80+b2);ctx.stroke();ctx.fillStyle="#fff";ctx.fillText("MC Híp",247,67+b2);
  ctx.fillStyle="#180828";ctx.fillRect(120,112,180,38);ctx.strokeStyle=c1;ctx.lineWidth=2.5;ctx.strokeRect(120,112,180,38);ctx.fillStyle="#ffea00";ctx.font="bold 10px sans-serif";ctx.fillText("🎧 DJ NIÊ NGỌC HIẾU & MC HÍP 🎤",210,135);
  let all=bots+(online?"|"+online:"")+"|"+me+" ⭐,"+mx+","+my+","+myCl+","+dance+","+gen+","+(stT>0?say:"");
  all.split("|").forEach((s,idx,arr)=>{
    if(!s)return;let p=s.split(","),x=Number(p.at(1)),y=Number(p.at(2)),cl=p.at(3),nm=p.at(0),dn=Number(p.at(4)),gd=Number(p.at(5)),msg=p.at(6)||"",isMe=idx===arr.length-1;
    if(!isMe&&nm===tgt&&repT>0)msg=rep;
    let sc=0.72+(y-175)/395,t=step*0.85+x*0.08;if(dn===5)t=Math.floor(step/2)*1.5;
    let by=dn===4?-Math.abs(Math.sin(t))*18:Math.sin(t)*4,hx=dn===1?Math.sin(t*1.6)*7:0,hip=dn===2?Math.sin(t*1.4)*8:0;
    ctx.save();ctx.translate(x,y+by);ctx.scale(sc,sc);ctx.fillStyle="rgba(0,0,0,0.45)";ctx.beginPath();ctx.ellipse(0,22-by,16,5,0,0,Math.PI*2);ctx.fill();
    if(gd===1){ctx.fillStyle="#212121";ctx.fillRect(hx-10,-18,20,22);ctx.fillStyle=cl;ctx.beginPath();ctx.moveTo(-8,-6);ctx.lineTo(8,-6);ctx.lineTo(14+hip,16);ctx.lineTo(-14+hip,16);ctx.closePath();ctx.fill();}
    else{ctx.fillStyle=cl;ctx.beginPath();ctx.moveTo(-9,-6);ctx.lineTo(9,-6);ctx.lineTo(10+hip,16);ctx.lineTo(-10+hip,16);ctx.closePath();ctx.fill();}
    ctx.fillStyle="#ffcc80";ctx.beginPath();ctx.arc(hx,-16,8,0,Math.PI*2);ctx.fill();ctx.fillStyle="#212121";ctx.beginPath();ctx.arc(hx,-18,8,Math.PI,0);ctx.fill();
    ctx.strokeStyle="#ffcc80";ctx.lineWidth=3;ctx.beginPath();
    if(dn===3){let f=Math.sin(t*2)*12;ctx.moveTo(-9,-2);ctx.lineTo(-22,-10+f);ctx.moveTo(9,-2);ctx.lineTo(22,-10-f);}
    else if(dn===6){ctx.moveTo(-9,-2);ctx.lineTo(-14,-22);ctx.moveTo(9,-2);ctx.lineTo(14,-22);}
    else if(dn===5){let r=(Math.floor(step/2)%2===0)?-15:4;ctx.moveTo(-9,-2);ctx.lineTo(-18,-2);ctx.lineTo(-18,r);ctx.moveTo(9,-2);ctx.lineTo(18,-2);ctx.lineTo(18,-r);}
    else{ctx.moveTo(-9,-2);ctx.lineTo(-16,-8+by);ctx.moveTo(9,-2);ctx.lineTo(16,-8-by);}
    ctx.stroke();ctx.fillStyle=isMe?"#ffea00":"#fff";ctx.font=isMe?"bold 13px sans-serif":"bold 11px sans-serif";ctx.textAlign="center";ctx.fillText(nm,hx,-30);
    if(msg){ctx.font="bold 10px sans-serif";let bw=Math.max(80,ctx.measureText(msg).width+16);ctx.fillStyle=isMe?"#ffea00":(nm==="Bé Mơ"?"#ff1744":"#00e5ff");ctx.fillRect(-bw/2,-58,bw,20);ctx.fillStyle=isMe?"#000":"#fff";ctx.fillText(msg,0,-44);}
    ctx.restore();
  });
  ctx.fillStyle="rgba(255,255,255,0.85)";ctx.font="bold 11px sans-serif";ctx.textAlign="center";ctx.fillText("© Tác giả: Niê Ngọc Hiếu • Ngã Tư Hồ Ea Kao",210,345);requestAnimationFrame(loop);
}
