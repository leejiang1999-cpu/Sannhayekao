<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sàn Nhảy Ea Kao - Niê Ngọc Hiếu</title>
<script src="https://jsdelivr.net"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
  body { background: #07070f; color: #fff; overflow: hidden; height: 100dvh; display: flex; flex-direction: column; user-select: none; }

  #login-screen {
    position: fixed; inset: 0; background: radial-gradient(circle, #240b36, #07070f 85%); z-index: 200;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; text-align: center;
  }
  .title-glow { font-size: 26px; font-weight: 900; color: #ff007f; text-shadow: 0 0 15px #ff007f; }
  .author-tag { font-size: 13px; color: #00f2fe; background: rgba(0,242,254,0.15); padding: 4px 14px; border-radius: 20px; border: 1px solid #00f2fe; }
  input, select { padding: 12px; border-radius: 12px; border: 1px solid #444; background: #161626; color: #fff; font-size: 16px; width: 100%; max-width: 290px; text-align: center; outline: none; }
  .btn-primary { padding: 14px; border-radius: 12px; border: none; background: linear-gradient(45deg, #ff007f, #7928ca); color: #fff; font-weight: bold; font-size: 16px; width: 100%; max-width: 290px; cursor: pointer; }

  #top-bar { padding: 6px 10px; background: rgba(10,10,20,0.95); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a40; font-size: 11px; gap: 4px; }
  .badge { background: #00e676; color: #000; padding: 3px 8px; border-radius: 12px; font-weight: bold; white-space: nowrap; }
  .btn-mini { background: #222238; color: #fff; border: 1px solid #444; padding: 4px 8px; border-radius: 8px; font-size: 11px; cursor: pointer; }

  #stage-area { height: 105px; background: linear-gradient(to bottom, #1a062e, #0c0c1a); position: relative; display: flex; justify-content: space-around; align-items: flex-end; padding-bottom: 6px; border-bottom: 2px solid #ff007f; }
  .speaker { width: 42px; height: 72px; background: #181824; border: 2px solid #333; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; animation: bassPulse 0.4s infinite alternate; }
  .woofer { width: 25px; height: 25px; border-radius: 50%; background: #111; border: 2px solid #ff007f; }
  .tweeter { width: 14px; height: 14px; border-radius: 50%; background: #222; border: 1px solid #00f2fe; }
  @keyframes bassPulse { 0% { transform: scale(1); } 100% { transform: scale(1.09); box-shadow: 0 0 12px #ff007f; } }

  .dj-booth { background: #1c0938; border: 2px solid #00f2fe; border-radius: 10px 10px 0 0; padding: 5px 12px; text-align: center; position: relative; }
  .dj-chars { font-size: 26px; display: flex; gap: 8px; justify-content: center; animation: bounceDJ 0.38s infinite alternate; }
  .dj-label { font-size: 9px; font-weight: bold; color: #00f2fe; margin-top: 2px; }
  .mc-shout { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); background: #ffea00; color: #000; font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 12px; white-space: nowrap; display: none; z-index: 30; }
  @keyframes bounceDJ { 0% { transform: translateY(0); } 100% { transform: translateY(-5px); } }

  #dance-floor { flex: 1; position: relative; overflow: hidden; touch-action: manipulation; background: radial-gradient(circle at 50% 0%, rgba(121,40,202,0.35), #07070f 75%); }
  #dance-floor::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,0,127,0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(0,242,254,0.12) 1px, transparent 1px); background-size: 32px 32px; pointer-events: none; }
  .laser { position: absolute; top: -10px; left: 25%; width: 3px; height: 110dvh; background: linear-gradient(to bottom, rgba(0,242,254,0.85), transparent); transform-origin: top center; animation: sweep1 2.8s infinite alternate ease-in-out; pointer-events: none; }
  .laser.l2 { left: 75%; background: linear-gradient(to bottom, rgba(255,0,127,0.85), transparent); animation: sweep2 2.2s infinite alternate ease-in-out; }
  @keyframes sweep1 { 0% { transform: rotate(-40deg); } 100% { transform: rotate(50deg); } }
  @keyframes sweep2 { 0% { transform: rotate(40deg); } 100% { transform: rotate(-50deg); } }
  .strobe-flash { animation: strobeBg 0.14s infinite; }
  @keyframes strobeBg { 0% { background-color: rgba(255,0,127,0.28); } 50% { background-color: rgba(0,242,254,0.28); } 100% { background-color: transparent; } }

  .player { position: absolute; transform: translate(-50%, -50%); text-align: center; transition: left 0.25s ease-out, top 0.25s ease-out; pointer-events: none; z-index: 5; }
  .player-name { background: rgba(0,0,0,0.75); padding: 2px 6px; border-radius: 8px; font-size: 10px; margin-bottom: 2px; white-space: nowrap; border: 1px solid #ff007f; font-weight: bold; }
  .chat-bubble { background: #fff; color: #000; padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; margin-bottom: 3px; max-width: 140px; word-wrap: break-word; }
  .avatar-wrap { font-size: 40px; display: inline-block; }

  .dance-chill { animation: animChill 0.6s infinite alternate ease-in-out; }
  @keyframes animChill { 0% { transform: translateY(0); } 100% { transform: translateY(-6px); } }
  .dance-quat { animation: animQuat 0.24s infinite alternate ease-in-out; }
  @keyframes animQuat { 0% { transform: rotate(-18deg) scale(1.08) translateX(-4px); } 100% { transform: rotate(18deg) scale(1.08) translateX(4px); } }
  .dance-lac { animation: animLac 0.22s infinite alternate ease-in-out; }
  @keyframes animLac { 0% { transform: skewX(-16deg); } 100% { transform: skewX(16deg) translateY(-8px); } }
  .dance-nhay { animation: animNhay 0.34s infinite alternate cubic-bezier(0.2,0.8,0.4,1); }
  @keyframes animNhay { 0% { transform: translateY(0) scaleY(0.9); } 100% { transform: translateY(-16px) scaleY(1.1); } }

  .fly-icon { position: absolute; bottom: 10px; font-size: 26px; pointer-events: none; animation: flyUp 2.2s ease-out forwards; z-index: 15; }
  @keyframes flyUp { 0% { transform: translateY(0) scale(0.8); opacity: 1; } 100% { transform: translateY(-320px) scale(1.5); opacity: 0; } }

  #controls-panel { background: #10101e; padding: 5px 6px; border-top: 1px solid #2a2a40; display: flex; flex-direction: column; gap: 5px; z-index: 20; }
  .scroll-row { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }
  .scroll-row::-webkit-scrollbar { display: none; }
  .action-btn { background: #1d1d33; color: #fff; border: 1px solid #3a3a5c; padding: 5px 10px; border-radius: 14px; font-size: 11px; font-weight: 600; white-space: nowrap; cursor: pointer; flex-shrink: 0; }
  .action-btn.active { background: #ff007f; border-color: #ff007f; }
  .trend-btn { background: #2b1055; border-color: #00f2fe; color: #e0f7fa; }

  #chat-bar { padding: 5px 6px 8px 6px; background: #0b0b14; display: flex; gap: 5px; z-index: 20; }
  #chat-input { flex: 1; text-align: left; padding: 8px 12px; font-size: 14px; border-radius: 20px; max-width: none; }
  .send-btn { background: #00e676; color: #000; border: none; padding: 0 14px; border-radius: 20px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<div id="login-screen">
  <div class="title-glow">🔥 SÀN NHẢY EA KAO 🔥</div>
  <div class="author-tag">Tác giả: Niê Ngọc Hiếu</div>
  <input type="text" id="username" placeholder="Nhập biệt danh của bạn..." maxlength="16">
  <select id="gender">
    <option value="nam">🕺 Nhân vật Nam (Soái Ca Quẩy)</option>
    <option value="nu">💃 Nhân vật Nữ (Nữ Hoàng Sàn Đêm)</option>
  </select>
  <button class="btn-primary" onclick="joinParty()">LÊN SÀN QUẨY NGAY</button>
</div>

<div id="top-bar">
  <div><b>Sàn Ea Kao</b> • <span style="color:#00f2fe;">Niê Ngọc Hiếu</span></div>
  <div style="display: flex; gap: 4px; align-items: center;">
    <button class="btn-mini" onclick="changeTrack()">🎵 Đổi Nhạc</button>
    <button class="btn-mini" onclick="toggleMusic()" id="music-btn">🔊</button>
    <span class="badge" id="online-count">1 online</span>
  </div>
</div>

<div id="stage-area">
  <div class="speaker"><div class="tweeter"></div><div class="woofer"></div></div>
  <div class="dj-booth">
    <div class="mc-shout" id="mc-shout">LÊN NÓC NHÀ!</div>
    <div class="dj-chars"><span>🎧</span><span>🎤</span></div>
    <div class="dj-label">DJ & MC HÍP LIVE</div>
  </div>
  <div class="speaker"><div class="tweeter"></div><div class="woofer"></div></div>
</div>

<div id="dance-floor" onclick="movePlayer(event)">
  <div class="laser"></div>
  <div class="laser l2"></div>
  <div id="players-container"></div>
</div>

<div id="controls-panel">
  <div class="scroll-row" id="dance-row">
    <button class="action-btn active" onclick="setDance('dance-nhay', this)">🔥 Nhảy Sung</button>
    <button class="action-btn" onclick="setDance('dance-quat', this)">🌀 Múa Quạt</button>
    <button class="action-btn" onclick="setDance('dance-lac', this)">🍑 Lắc Mông</button>
    <button class="action-btn" onclick="setDance('dance-chill', this)">😎 Đứng Chill</button>
    <button class="action-btn" onclick="triggerFX('strobe')">⚡ Chớp Đèn</button>
    <button class="action-btn" onclick="triggerFX('heart')">❤️ Thả Tim</button>
    <button class="action-btn" onclick="triggerFX('firework')">🎆 Pháo Hoa</button>
  </div>
  <div class="scroll-row">
    <button class="action-btn trend-btn" onclick="playTrend('Lên nóc nhà là bắt con gà!', 'horn')">📢 Lên nóc nhà!</button>
    <button class="action-btn trend-btn" onclick="playTrend('Hết nước chấm luôn anh em ơi!', 'bass')">🔥 Hết nước chấm</button>
    <button class="action-btn trend-btn" onclick="playTrend('Quẩy lên Ea Kao ơi! Bay nóc!', 'horn')">🎉 Quẩy lên Ea Kao!</button>
    <button class="action-btn trend-btn" onclick="playTrend('Keo lỳ tái châu, mãi đỉnh!', 'bass')">✨ Keo lỳ tái châu</button>
    <button class="action-btn trend-btn" onclick="playTrend('Đưa tay đây nào, mãi bên nhau bạn nhé!', 'horn')">🤝 Mãi bên nhau</button>
  </div>
</div>

<div id="chat-bar">
  <input type="text" id="chat-input" placeholder="Nhắn tin cùng mọi người..." maxlength="45" onkeypress="if(event.key==='Enter') sendChat()">
  <button class="send-btn" onclick="sendChat()">Gửi</button>
</div>

<audio id="bg-music" loop playsinline></audio>
<script>
  const SUPABASE_URL = 'https://supabase.co';
  const SUPABASE_KEY = 'sb_publishable_mvY419VuNxbjo7UF1jXExQ_2RSPbSNd';

  const tracks = [
    'https://soundhelix.com',
    'https://soundhelix.com',
    'https://soundhelix.com'
  ];
  let trackIdx = 0;

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const myId = 'ekao_' + Math.random().toString(36).substr(2, 9);
  let myState = { id: myId, name: 'Dân Chơi Ea Kao', gender: 'nam', dance: 'dance-nhay', x: 50, y: 50, msg: '' };
  let channel, audioCtx;

  function playDJEffect(type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      if (type === 'horn') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(420, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(380, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);
        osc.start(); osc.stop(audioCtx.currentTime + 0.45);
      } else {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
      }
    } catch (e) {}
  }

  function speakTrend(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'vi-VN'; utter.rate = 1.15;
      window.speechSynthesis.speak(utter);
    }
  }

  function joinParty() {
    myState.name = document.getElementById('username').value.trim() || 'Dân Chơi Ea Kao';
    myState.gender = document.getElementById('gender').value;
    myState.x = Math.floor(Math.random() * 60) + 20;
    myState.y = Math.floor(Math.random() * 55) + 20;
    document.getElementById('login-screen').style.display = 'none';

    const audio = document.getElementById('bg-music');
    audio.src = tracks[trackIdx]; audio.volume = 0.6;
    audio.play().catch(() => {});
    document.getElementById('music-btn').innerText = '⏸';

    playDJEffect('horn');
    showMCShout('CHÀO MỪNG ' + myState.name.toUpperCase() + ' ĐẾN SÀN EA KAO!');

    channel = supabaseClient.channel('san-nhay-eakao-live', { config: { presence: { key: myId } } });
    channel
      .on('presence', { event: 'sync' }, () => renderPlayers(channel.presenceState()))
      .on('broadcast', { event: 'party-event' }, (p) => {
        const d = p.payload;
        if (d.type === 'trend') { showMCShout(d.text); playDJEffect(d.sound); speakTrend(d.text); }
        else if (d.type === 'fx') runFX(d.fxName);
      })
      .subscribe(async (status) => { if (status === 'SUBSCRIBED') await channel.track(myState); });
  }

  function movePlayer(e) {
    if (!channel) return;
    const rect = document.getElementById('dance-floor').getBoundingClientRect();
    myState.x = (((e.clientX - rect.left) / rect.width) * 100).toFixed(1);
    myState.y = (((e.clientY - rect.top) / rect.height) * 100).toFixed(1);
    channel.track(myState);
  }

  function setDance(danceClass, btn) {
    document.querySelectorAll('#dance-row .action-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    myState.dance = danceClass;
    if (channel) channel.track(myState);
  }

  function playTrend(text, sound) {
    showMCShout(text); playDJEffect(sound); speakTrend(text);
    myState.msg = '🎤 ' + text;
    if (channel) {
      channel.track(myState);
      channel.send({ type: 'broadcast', event: 'party-event', payload: { type: 'trend', text, sound } });
    }
    setTimeout(() => { myState.msg = ''; if (channel) channel.track(myState); }, 4500);
  }

  function triggerFX(fxName) {
    runFX(fxName);
    if (channel) channel.send({ type: 'broadcast', event: 'party-event', payload: { type: 'fx', fxName } });
  }

  function runFX(fxName) {
    const floor = document.getElementById('dance-floor');
    if (fxName === 'strobe') {
      playDJEffect('bass');
      floor.classList.add('strobe-flash');
      setTimeout(() => floor.classList.remove('strobe-flash'), 1500);
    } else {
      const icon = fxName === 'heart' ? '❤️' : '🎆';
      for (let i = 0; i < 8; i++) {
        const el = document.createElement('div');
        el.className = 'fly-icon'; el.innerText = icon;
        el.style.left = (Math.random() * 80 + 10) + '%';
        el.style.animationDuration = (Math.random() * 1 + 1.5) + 's';
        floor.appendChild(el);
        setTimeout(() => el.remove(), 2500);
      }
    }
  }

  function showMCShout(text) {
    const shout = document.getElementById('mc-shout');
    shout.innerText = 'MC HÍP: ' + text; shout.style.display = 'block';
    clearTimeout(window.shoutTimer);
    window.shoutTimer = setTimeout(() => { shout.style.display = 'none'; }, 4000);
  }

  function sendChat() {
    if (!channel) return;
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    myState.msg = text; input.value = '';
    channel.track(myState);
    setTimeout(() => { myState.msg = ''; channel.track(myState); }, 5000);
  }

  function changeTrack() {
    trackIdx = (trackIdx + 1) % tracks.length;
    const audio = document.getElementById('bg-music');
    audio.src = tracks[trackIdx]; audio.play();
    document.getElementById('music-btn').innerText = '⏸';
    showMCShout('ĐÃ CHUYỂN SANG MIX SỐ ' + (trackIdx + 1) + '!');
  }

  function toggleMusic() {
    const audio = document.getElementById('bg-music');
    const btn = document.getElementById('music-btn');
    if (audio.paused) { audio.play(); btn.innerText = '⏸'; }
    else { audio.pause(); btn.innerText = '🔊'; }
  }

  function renderPlayers(presenceState) {
    const container = document.getElementById('players-container');
    const keys = Object.keys(presenceState);
    document.getElementById('online-count').innerText = keys.length + ' đang quẩy';
    container.innerHTML = '';
    keys.forEach(key => {
      const stateList = presenceState[key];
      const p = Array.isArray(stateList) ? stateList[0] : stateList;
      if (!p) return;
      const icon = p.gender === 'nu' ? '💃' : '🕺';
      const div = document.createElement('div');
      div.className = 'player';
      div.style.left = p.x + '%'; div.style.top = p.y + '%';
      div.innerHTML = `
        ${p.msg ? <div class="chat-bubble">${p.msg}</div> : ''}
        <div class="player-name" style="border-color: ${p.gender === 'nu' ? '#00f2fe' : '#ff007f'}">${p.name}</div>
        <div class="avatar-wrap ${p.dance}">${icon}</div>
      `;
      container.appendChild(div);
    });
  }
</script>
</body>
</html>
